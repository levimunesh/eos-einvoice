<title>eos e-invoice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a desk with one document on it. Four work areas along the top; the invoice is always shown as a sheet of paper. */
:root {
  --bg: #ECEEF3; --surface: #FFFFFF; --surface-2: #F5F6FA; --ink: #161A26; --ink-2: #4E556A; --line: #D3D8E3;

  --paper: #FFFFFF; --paper-ink: #1A1C21; --paper-muted: #5B6170; --paper-line: #D9DCE4; --shadow: 0 1px 2px rgba(22,26,38,.06), 0 8px 24px rgba(22,26,38,.08);

  --f-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;

}

  --bg: #11131A; --surface: #1A1D27; --surface-2: #222632; --ink: #E7E9F2; --ink-2: #A2A9BD; --line: #343A4B;
  --accent: #A3A8FF; --accent-ink: #11131A; --accent-soft: #2A2D57;
  --ok: #5FCB95; --ok-soft: #153224; --warn: #E7B657; --warn-soft: #382C10; --err: #FF8E85; --err-soft: #3E1F1D;
  --paper: #E9EBF1; --paper-ink: #1A1C21; --paper-muted: #555B6A; --paper-line: #C9CDD8; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11131A; --surface: #1A1D27; --surface-2: #222632; --ink: #E7E9F2; --ink-2: #A2A9BD; --line: #343A4B;
  --accent: #A3A8FF; --accent-ink: #11131A; --accent-soft: #2A2D57;
  --ok: #5FCB95; --ok-soft: #153224; --warn: #E7B657; --warn-soft: #382C10; --err: #FF8E85; --err-soft: #3E1F1D;
  --paper: #E9EBF1; --paper-ink: #1A1C21; --paper-muted: #555B6A; --paper-line: #C9CDD8; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 0 56px; }
@media (max-width: 520px) { .wrap { padding-inline: 16px; } }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h2 { font-size: 26px; } h3 { font-size: 19px; }
p { margin: 0; }
.muted { color: var(--ink-2); } .mono { font-family: var(--f-mono); font-size: .93em; } .small { font-size: 13px; }
.eyebrow { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 18px 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-mark { width: 26px; height: 13px; border-radius: 26px 26px 0 0; background: var(--accent); align-self: center; position: relative; top: -1px; box-shadow: 0 5px 0 -3px var(--accent); }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 25px; letter-spacing: -.005em; }
.brand-name span { font-weight: 500; color: var(--ink-2); }
.market { margin-left: auto; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; justify-content: flex-end; }
.market label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.market select { width: auto; min-width: 150px; font-weight: 600; }
.market-formats { flex-basis: 100%; text-align: right; font-size: 12.5px; }
@media (max-width: 640px) { .market { margin-left: 0; width: 100%; justify-content: flex-start; } .market select { flex: 1; } .market-formats { text-align: left; } }

/* tabs */
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.tab { appearance: none; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--ink-2); font: inherit; padding: 11px 12px 10px; text-align: left; cursor: pointer; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tab:last-child { border-right: 0; }
.tab b { font-family: var(--f-display); font-weight: 600; font-size: 18px; color: var(--ink); letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.tab span { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }

.count { font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); border-radius: 20px; padding: 0 7px; line-height: 18px; }
@media (max-width: 640px) { .tab span { display: none; } .tab { padding: 10px 8px; text-align: center; align-items: center; } .tab b { font-size: 16px; } .count { display: none; } }

.view { padding-top: 22px; display: flex; flex-direction: column; gap: 18px; }
.view-head { display: flex; flex-direction: column; gap: 4px; max-width: 70ch; }

/* panels */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.step { font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--accent-ink); background: var(--accent); width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; position: relative; top: -2px; }
.tag { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
.tag.neutral { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }

/* buttons */
.btn { appearance: none; font: inherit; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; min-height: 38px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
.btn.quiet:hover { background: var(--accent-soft); }
.btn.danger { color: var(--err); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button.link { appearance: none; border: 0; background: none; padding: 0; font: inherit; font-size: 12.5px; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; margin-left: 8px; }

/* drop zone */
.drop { border: 1.5px dashed var(--line); border-radius: var(--r); background: var(--surface-2); padding: 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop-text { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.drop-text b { font-weight: 600; }
.filechip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; font-size: 13px; max-width: 100%; overflow-wrap: anywhere; }
.notice { border-radius: var(--r); padding: 10px 14px; font-size: 14px; background: var(--surface-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.notice.ok { background: var(--ok-soft); border-color: transparent; color: var(--ink); }
.notice.warn { background: var(--warn-soft); border-color: transparent; }
.notice.err { background: var(--err-soft); border-color: transparent; }
.notice ul { margin: 0; padding-left: 18px; }
.spinner { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } * { scroll-behavior: auto !important; } }

/* convert layout */
.convert-grid { display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 18px; align-items: start; }
.convert-grid > * { min-width: 0; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 24px); overflow-y: auto; }
@media (max-width: 980px) { .convert-grid { grid-template-columns: minmax(0, 1fr); } .side { position: static; max-height: none; overflow: visible; } }

/* form */
.form { display: flex; flex-direction: column; gap: 22px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 12px; }

legend::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px 12px; }
.f { display: flex; flex-direction: column; gap: 4px; grid-column: span 2; min-width: 0; }
.f.w3 { grid-column: span 3; } .f.w4 { grid-column: span 4; } .f.w6 { grid-column: span 6; } .f.w1 { grid-column: span 1; }
@media (max-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .f, .f.w3, .f.w1 { grid-column: span 1; } .f.w4, .f.w6, .f.wide-m { grid-column: span 2; } }
label, .lab { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
label .req { color: var(--err); margin-left: 2px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 7px 9px; width: 100%; min-width: 0; min-height: 36px; }
textarea { resize: vertical; min-height: 62px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
input.num { text-align: right; font-variant-numeric: tabular-nums; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 35% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
.bad { border-color: var(--err); }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; color: var(--ink); font-weight: 400; cursor: pointer; }
.check input { width: 17px; height: 17px; min-height: 0; margin-top: 2px; flex: none; accent-color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .seg { grid-template-columns: minmax(0, 1fr); } }
.seg label { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; color: var(--ink); font-size: 14px; font-weight: 400; background: var(--surface); }
.seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.seg input { width: 16px; height: 16px; min-height: 0; margin-top: 3px; flex: none; accent-color: var(--accent); }
.seg b { display: block; font-weight: 600; } .seg small { color: var(--ink-2); font-size: 12.5px; }

/* line editor */
.lines { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.line { display: grid; grid-template-columns: 22px minmax(0, 1fr) 84px 116px 110px 122px 30px; grid-template-areas: "no name name name name amt x" "no desc qty unit price vat ."; gap: 6px 8px; align-items: end; padding: 10px; }
.line + .line { border-top: 1px solid var(--line); }
.line .no { grid-area: no; align-self: start; font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); padding-top: 9px; }
.line .name { grid-area: name; min-width: 0; } .line .descw { grid-area: desc; min-width: 0; } .line .qty { grid-area: qty; } .line .unit { grid-area: unit; } .line .price { grid-area: price; } .line .vat { grid-area: vat; display: flex; flex-direction: column; gap: 5px; }
.line input.desc { font-size: 13.5px; color: var(--ink-2); }
.line .amt { grid-area: amt; align-self: center; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; overflow-wrap: anywhere; }
.line .x { grid-area: x; align-self: center; appearance: none; border: 0; background: none; color: var(--ink-2); cursor: pointer; font-size: 18px; line-height: 1; padding: 8px 4px; border-radius: 4px; }
.line .x:hover { color: var(--err); background: var(--err-soft); }
.line .mlab { display: block; font-size: 11.5px; color: var(--ink-2); margin-bottom: 2px; }
.line.ac { grid-template-columns: 96px minmax(0, 1fr) 122px 122px 30px; grid-template-areas: "kind name amount vat x"; align-items: end; }
.line.ac .kind { grid-area: kind; align-self: center; justify-self: start; } .line.ac .amount { grid-area: amount; }
@media (max-width: 760px) {
  .line { grid-template-columns: repeat(2, minmax(0, 1fr)) 30px; grid-template-areas: "name name x" "desc desc desc" "qty unit unit" "price vat vat" "amt amt amt"; padding: 12px; }
  .line .no { display: none; } .line .amt { text-align: left; } .line .amt::before { content: 'Net amount  '; font-weight: 400; color: var(--ink-2); font-size: 12px; }
  .line.ac { grid-template-columns: repeat(2, minmax(0, 1fr)) 30px; grid-template-areas: "kind kind x" "name name name" "amount vat vat"; }
}
.totals { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 18px; font-variant-numeric: tabular-nums; margin-left: auto; width: min(100%, 360px); }
.totals dt { color: var(--ink-2); } .totals dd { margin: 0; text-align: right; }
.totals .strong { font-weight: 600; color: var(--ink); border-top: 1.5px solid var(--ink); padding-top: 6px; margin-top: 4px; font-size: 16px; }
dl { margin: 0; }

/* verdict + findings */
.verdict { display: flex; gap: 14px; align-items: center; }
.verdict-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.verdict-text b { font-family: var(--f-display); font-size: 20px; font-weight: 600; line-height: 1.15; }
.seal { flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; border: 2px solid currentColor; box-shadow: inset 0 0 0 2px var(--surface), inset 0 0 0 3px currentColor; transform: rotate(-9deg); text-align: center; line-height: 1; }
.seal.ok { color: var(--ok); } .seal.warn { color: var(--warn); } .seal.err { color: var(--err); } .seal.wait { color: var(--ink-2); transform: none; border-style: dashed; box-shadow: none; }
.findings { display: flex; flex-direction: column; gap: 8px; }
.finding { border: 1px solid var(--line); border-left-width: 4px; border-radius: 4px; padding: 9px 12px; display: flex; flex-direction: column; gap: 3px; background: var(--surface); min-width: 0; }
.finding.error { border-left-color: var(--err); } .finding.warning { border-left-color: var(--warn); } .finding.info { border-left-color: var(--line); }
.finding-top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.finding-title { font-weight: 600; flex: 1 1 200px; min-width: 0; }
.pill { font-family: var(--f-display); font-weight: 600; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; padding: 1px 7px; border-radius: 3px; white-space: nowrap; }
.pill.error { background: var(--err-soft); color: var(--err); } .pill.warning { background: var(--warn-soft); color: var(--warn); } .pill.info { background: var(--surface-2); color: var(--ink-2); } .pill.ok { background: var(--ok-soft); color: var(--ok); }
.finding-fix { color: var(--ink); font-size: 14px; }
.finding details { font-size: 12.5px; color: var(--ink-2); }
.finding summary { cursor: pointer; width: fit-content; }
.finding details div { margin-top: 4px; overflow-wrap: anywhere; }
.group-title { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); margin-top: 6px; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
.facts dt { color: var(--ink-2); } .facts dd { margin: 0; overflow-wrap: anywhere; }

/* paper */
.desk { display: flex; justify-content: center; }
.paper { position: relative; background: var(--paper); color: var(--paper-ink); width: 100%; max-width: 820px; border-radius: 2px; box-shadow: var(--shadow); padding: clamp(18px, 5vw, 52px); display: flex; flex-direction: column; gap: 26px; font-size: 14px; min-width: 0; }
.paper .p-label { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--paper-muted); margin-bottom: 4px; }
.p-head { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.p-doctype { font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--paper-muted); }
.p-docno { font-family: var(--f-display); font-weight: 600; font-size: 30px; line-height: 1.1; overflow-wrap: anywhere; }
.p-meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 16px; font-size: 13.5px; }
.p-meta dt { color: var(--paper-muted); } .p-meta dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.p-parties { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 22px; }
.p-party { min-width: 0; overflow-wrap: anywhere; } .p-name { font-weight: 600; font-size: 15px; }
.p-sub, .p-kv { color: var(--paper-muted); font-size: 12.5px; } .p-kv { display: flex; gap: 6px; } .p-kv span:first-child { flex: none; white-space: nowrap; } .p-kv span:first-child::after { content: ':'; } .p-kv span:last-child { min-width: 0; }
.p-kv:first-of-type { margin-top: 6px; }
.p-table { border-top: 1.5px solid var(--paper-ink); }
.p-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 110px 92px 54px 100px; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--paper-line); font-variant-numeric: tabular-nums; }
.p-row-head { font-size: 12px; color: var(--paper-muted); font-weight: 500; padding: 6px 0; }
.p-row .c2, .p-row .c3, .p-row .c4, .p-row .c5 { text-align: right; } .p-row .c0 { color: var(--paper-muted); } .p-item { font-weight: 500; overflow-wrap: anywhere; }
@media (max-width: 640px) { .p-row { grid-template-columns: 24px minmax(0, 1fr) 84px; } .p-row .c3, .p-row .c4 { display: none; } .p-row .c2 { grid-column: 2; text-align: left; color: var(--paper-muted); font-size: 12.5px; } .p-row .c5 { grid-column: 3; grid-row: 1; } .p-row-head .c2 { display: none; } }
.p-totals { margin-left: auto; width: min(100%, 380px); display: flex; flex-direction: column; gap: 6px; font-variant-numeric: tabular-nums; }
.p-totals dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 18px; } .p-totals dt { color: var(--paper-muted); } .p-totals dd { margin: 0; text-align: right; }
.p-grand { border-top: 1.5px solid var(--paper-ink); padding-top: 7px; } .p-grand .strong { font-weight: 600; font-size: 16.5px; color: var(--paper-ink); }
.p-foot { display: flex; flex-wrap: wrap; gap: 20px 28px; border-top: 1px solid var(--paper-line); padding-top: 18px; } .p-pay { flex: 1.6 1 300px; min-width: 0; } .p-notes { flex: 1 1 190px; min-width: 0; }
.p-pay dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 14px; } .p-pay dt { color: var(--paper-muted); } .p-pay dd { margin: 0; overflow-wrap: anywhere; }
.p-terms, .p-notes p { white-space: pre-wrap; overflow-wrap: anywhere; } .p-terms { margin-top: 8px; }
